room-runtime = { group = "androidx.room", name = "room-paging", version.ref = "room"}
retrofit_runtime = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit"}
retrofit_moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit"}
